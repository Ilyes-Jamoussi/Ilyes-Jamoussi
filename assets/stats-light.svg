<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="statsTitle">
  <title id="statsTitle">GitHub activity: 889 contributions in the last 12 months, 9 public repositories, most used languages</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#218bff"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .caps { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #57606a; }
    .big { font-size: 64px; font-weight: 700; letter-spacing: -1px; fill: #1f2328; }
    .sub { font-size: 16px; fill: #57606a; }
    .lang { font-size: 14px; fill: #1f2328; }
    .pct { font-size: 13px; fill: #57606a; }
    .note { font-size: 11px; fill: #6e7681; }
    .bar { transform-origin: 680px 0; animation: grow 0.8s ease-out backwards; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="14" fill="url(#bg)" stroke="#d0d7de"/>
  <text x="64" y="66" class="caps">CONTRIBUTIONS · LAST 12 MONTHS</text>
  <text x="64" y="146" class="big">889</text>
  <rect x="66" y="164" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="200" class="sub">9 public repositories</text>
  <line x1="480" y1="48" x2="480" y2="202" stroke="#d0d7de"/>
  <text x="540" y="66" class="caps">MOST USED LANGUAGES</text>
  <text x="540" y="100" class="lang">Python</text>
  <rect x="680" y="92" width="400" height="8" rx="4" fill="#eaeef2"/>
  <rect x="680" y="92" width="400.0" height="8" rx="4" fill="#0969da" class="bar" style="animation-delay: 0.0s"/>
  <text x="1136" y="100" text-anchor="end" class="pct">50.2%</text>
  <text x="540" y="127" class="lang">TypeScript</text>
  <rect x="680" y="119" width="400" height="8" rx="4" fill="#eaeef2"/>
  <rect x="680" y="119" width="150.9" height="8" rx="4" fill="#0969da" class="bar" style="animation-delay: 0.1s"/>
  <text x="1136" y="127" text-anchor="end" class="pct">18.9%</text>
  <text x="540" y="154" class="lang">C++</text>
  <rect x="680" y="146" width="400" height="8" rx="4" fill="#eaeef2"/>
  <rect x="680" y="146" width="78.1" height="8" rx="4" fill="#0969da" class="bar" style="animation-delay: 0.2s"/>
  <text x="1136" y="154" text-anchor="end" class="pct">9.8%</text>
  <text x="540" y="181" class="lang">Dart</text>
  <rect x="680" y="173" width="400" height="8" rx="4" fill="#eaeef2"/>
  <rect x="680" y="173" width="35.6" height="8" rx="4" fill="#0969da" class="bar" style="animation-delay: 0.3s"/>
  <text x="1136" y="181" text-anchor="end" class="pct">4.5%</text>
  <text x="540" y="208" class="lang">CSS</text>
  <rect x="680" y="200" width="400" height="8" rx="4" fill="#eaeef2"/>
  <rect x="680" y="200" width="32.7" height="8" rx="4" fill="#0969da" class="bar" style="animation-delay: 0.4s"/>
  <text x="1136" y="208" text-anchor="end" class="pct">4.1%</text>
  <text x="1136" y="232" text-anchor="end" class="note">byte share averaged across public repositories · refreshed weekly</text>
</svg>
