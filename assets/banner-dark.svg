<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Ilyes Jamoussi — machine learning from scratch, production-grade software</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name {
      font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      letter-spacing: -1px;
      fill: #f0f6fc;
    }
    .tag {
      font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      letter-spacing: 0.3px;
      fill: #8b949e;
      animation: fade 1s ease-out;
    }
    .mark {
      transform-origin: 64px 70px;
      animation: draw 0.9s ease-out;
    }
    .net { stroke: #2f81f7; stroke-width: 1.2; opacity: 0.16; }
    .node { fill: #2f81f7; opacity: 0.42; }
    .pulse { animation: pulse 5s ease-in-out infinite alternate; }
    @keyframes draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { .mark, .tag, .pulse { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="14" fill="url(#glow)"/>
  <g class="net">
    <line x1="880" y1="72" x2="962" y2="52"/>
    <line x1="962" y1="52" x2="1052" y2="66"/>
    <line x1="1052" y1="66" x2="1122" y2="96"/>
    <line x1="962" y1="52" x2="940" y2="120"/>
    <line x1="940" y1="120" x2="1022" y2="130"/>
    <line x1="1022" y1="130" x2="1092" y2="162"/>
    <line x1="940" y1="120" x2="902" y2="172"/>
    <line x1="1022" y1="130" x2="982" y2="186"/>
    <line x1="1052" y1="66" x2="1022" y2="130"/>
    <line x1="880" y1="72" x2="940" y2="120"/>
  </g>
  <g>
    <circle class="node" cx="880" cy="72" r="3.5"/>
    <circle class="node pulse" cx="962" cy="52" r="4.5"/>
    <circle class="node" cx="1052" cy="66" r="3"/>
    <circle class="node" cx="1122" cy="96" r="3.5"/>
    <circle class="node pulse" cx="940" cy="120" r="5" style="animation-delay: 2.2s"/>
    <circle class="node" cx="1022" cy="130" r="4"/>
    <circle class="node" cx="1092" cy="162" r="3"/>
    <circle class="node" cx="902" cy="172" r="3.5"/>
    <circle class="node" cx="982" cy="186" r="3"/>
  </g>
  <rect class="mark" x="64" y="70" width="4" height="90" rx="2" fill="url(#accent)"/>
  <text x="94" y="118" class="name">Ilyes Jamoussi</text>
  <text x="96" y="156" class="tag">Machine learning from scratch · Production-grade software</text>
</svg>
